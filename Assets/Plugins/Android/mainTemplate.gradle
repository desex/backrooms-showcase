apply plugin: 'com.android.library'
**APPLY_PLUGINS**

dependencies {
    // ------ Yandex Metrica ------
    implementation 'com.yandex.android:mobmetricalib:5.2.0'
    
    // ------ Google Play Core ------
    implementation 'com.google.android.play:review:2.0.1'
        
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'

    // ------ Facebook ------
     implementation 'com.facebook.android:facebook-android-sdk:17.0.1'
     implementation(name: 'facebook-android-wrapper-17.0.1', ext:'aar')
     
     // ------ Appodeal ------
    implementation 'com.appodeal.ads.sdk.networks:applovin:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:bidmachine:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:bidon:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:bigo_ads:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:dt_exchange:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:iab:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:inmobi:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:ironsource:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:meta:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:mintegral:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:my_target:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:unity_ads:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:vungle:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.networks:yandex:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.services:adjust:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.services:appsflyer:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.services:facebook_analytics:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.services:firebase:3.5.0.0'
    implementation 'com.appodeal.ads.sdk.services:sentry_analytics:3.5.0.0'
    implementation 'com.appodeal.ads.sdk:core:3.5.0'
         
         
    // ------ Game Analytics ------
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // ------ AppsFlyer ------
    implementation 'com.appsflyer:af-android-sdk:6.14.0'
    implementation 'com.appsflyer:unity-wrapper:6.14.0'
    runtimeOnly 'com.android.installreferrer:installreferrer:2.1'
}

android {
    ndkPath "**NDKPATH**"
	namespace "com.unity3d.player"
    compileSdkVersion **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        multiDexEnabled true
        minSdkVersion **MINSDKVERSION**
        targetSdkVersion **TARGETSDKVERSION**
        ndk {
            abiFilters **ABIFILTERS**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING_OPTIONS**
}**REPOSITORIES**
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
